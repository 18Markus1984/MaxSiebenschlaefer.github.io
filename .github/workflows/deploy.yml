name: Webseite bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # täglich 05:17 bzw. 06:17 Uhr deutscher Zeit: Zahlen aktualisieren
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Zahlen von GitHub, Printables und YouTube holen
        run: npm run stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRINTABLES_USER_ID: ${{ vars.PRINTABLES_USER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Geänderte Zahlen speichern
        run: |
          if ! git diff --quiet src/data/stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/stats.json
            git commit -m "Zahlen aktualisiert"
            git push
          fi

      - name: Pfad für GitHub Pages bestimmen
        id: paths
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "site=https://${{ vars.CUSTOM_DOMAIN }}" >> "$GITHUB_OUTPUT"; echo "base=/" >> "$GITHUB_OUTPUT"
          elif [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            echo "site=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"; echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"; echo "base=/${REPO}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          SITE_URL: ${{ steps.paths.outputs.site }}
          BASE_PATH: ${{ steps.paths.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
